<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamax Sales Toolkit — Sign in</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#2AF598;--blue:#009EFD;--bg:#050810;--grey:#A0AEC0;--white:#E6EAF0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--white);
       background:var(--bg);background-image:radial-gradient(circle at 50% -20%,#0B1221,#050810);
       display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  .marks{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px}
  .marks img.logo{height:38px;width:auto;object-fit:contain}
  .marks .sep{width:1px;height:38px;background:rgba(255,255,255,.14)}
  .marks img.mascot{width:96px;height:96px;object-fit:contain;
       animation:float 4s ease-in-out infinite;
       filter:drop-shadow(0 12px 18px rgba(42,245,152,.18))}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:2.1rem;text-align:center;margin:0 0 6px;line-height:1.2}
  h1 .g{background:linear-gradient(135deg,var(--green),var(--blue));
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{text-align:center;color:var(--grey);font-size:.95rem;margin-bottom:32px}
  form{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
       border-radius:16px;padding:30px;backdrop-filter:blur(12px);
       box-shadow:0 10px 30px rgba(0,0,0,.3)}
  label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;
        color:var(--grey);margin:0 0 6px}
  input{width:100%;padding:11px 13px;margin-bottom:18px;border-radius:8px;
        background:rgba(20,25,40,.85);border:1px solid rgba(255,255,255,.1);
        color:var(--green);font-size:.95rem;font-family:inherit;outline:none;color-scheme:dark}
  input:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  input::placeholder{color:rgba(160,174,192,.55)}
  button{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;
         font-weight:700;font-size:1rem;font-family:inherit;color:#050810;
         background:linear-gradient(135deg,var(--green),var(--blue));transition:.25s}
  button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 15px rgba(42,245,152,.4)}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .err{display:none;margin-top:16px;padding:11px 13px;border-radius:8px;font-size:.85rem;
       background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.35);color:#ff8b95}
  .err.show{display:block}
  .foot{text-align:center;color:#5c6880;font-size:.75rem;margin-top:22px}
  .or{display:flex;align-items:center;gap:12px;margin:20px 0 16px;
      color:#5c6880;font-size:.72rem;text-transform:uppercase;letter-spacing:1px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
  .msbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
         padding:11px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.92rem;
         color:var(--white);background:rgba(255,255,255,.05);
         border:1px solid rgba(255,255,255,.14);transition:.25s}
  .msbtn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28);
               transform:translateY(-2px)}
  .msbtn svg{flex:none}
  .hint{text-align:center;color:#5c6880;font-size:.72rem;margin:10px 0 0}

  /* --- Login easter eggs: the HTML port of the Streamlit transition ------- */
  #egg{position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;
       align-items:center;justify-content:center;padding:24px;text-align:center;
       background:var(--bg);background-image:radial-gradient(circle at 50% -20%,#0B1221,#050810);
       cursor:pointer}
  #egg.show{display:flex}
  #egg img{max-width:450px;width:90%;height:auto;border-radius:12px;
           border:2px solid rgba(255,255,255,.1);box-shadow:0 15px 40px rgba(0,0,0,.6)}
  #egg .emoji{font-size:120px;line-height:1;
              filter:drop-shadow(0 10px 25px rgba(42,245,152,.6));text-shadow:0 0 10px var(--green);
              animation:heartBounce .4s infinite alternate cubic-bezier(.5,.05,1,.5)}
  @keyframes heartBounce{0%{transform:translateY(0) scale(1)}
                         100%{transform:translateY(-20px) scale(1.15)}}
  #egg h2{color:var(--green);margin:34px 0 0;font-weight:700;font-size:1.6rem;
          text-shadow:0 2px 10px rgba(42,245,152,.4);line-height:1.35}
  #egg .sub{color:var(--grey);font-size:1rem;margin-top:10px}
  #egg .skip{color:#5c6880;font-size:.72rem;margin-top:26px}
  @keyframes pulseText{0%,100%{opacity:1}50%{opacity:.3}}
  .loading-text{animation:pulseText 1.5s infinite ease-in-out}
  /* Respect a user who has asked the OS for less motion. */
  @media (prefers-reduced-motion:reduce){
    #egg .emoji{animation:none}
    .loading-text{animation:none}
    .marks img.mascot{animation:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="marks">
      <img class="logo" src="/assets/streamax%20logo.png" alt="Streamax"
           onerror="this.style.display='none';this.nextElementSibling.style.display='none';">
      <span class="sep"></span>
      <img class="mascot" src="/assets/mascot.png" alt="Streamax mascot"
           onerror="this.src='/assets/jerry.png';">
    </div>
    <h1><span class="g">Streamax</span> Sales Toolkit</h1>
    <p class="sub">Secure Access &bull; Trucking Division</p>
    <form id="f" autocomplete="on">
      <label for="email">Streamax email</label>
      <!-- type="text", not "email": the browser's email validation rejects the
           easter-egg accounts (jerry_test, test_account …) before the form can
           even submit. The pattern still catches a malformed address — it
           accepts either a full email OR an @-less identifier, so "name@streamax"
           is rejected while "jerry_test" gets through to the server, which is
           the only thing that actually decides what is valid.
           inputmode="email" keeps the @ key on mobile keyboards. -->
      <input id="email" name="email" type="text"
             inputmode="email" autocomplete="username"
             spellcheck="false" autocapitalize="none"
             pattern="[^@\s]+@[^@\s]+\.[^@\s]+|[^@\s]+"
             title="Enter your @streamax.com email address."
             placeholder="name@streamax.com" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required>
      <button id="btn" type="submit">Authenticate</button>
      <div class="err" id="err"></div>
      <!--MS_SIGNIN-->
    </form>
    <p class="foot">Verified against the Streamax mail server. Credentials are never stored.</p>
  </div>

  <!-- Easter-egg transition. Content comes from the server (login.LOGIN_EASTER_EGGS)
       so this and the Streamlit login can't drift apart. -->
  <div id="egg" onclick="eggFinish()">
    <img id="egg-img" alt="" style="display:none">
    <div id="egg-emoji" class="emoji" style="display:none"></div>
    <h2 id="egg-headline"></h2>
    <p id="egg-sub" class="sub loading-text"></p>
    <p class="skip">click anywhere to continue</p>
  </div>
<script>
  var f = document.getElementById('f'), btn = document.getElementById('btn'), err = document.getElementById('err');

  // Where to land after signing in (/login?next=/jerry). Captured before the
  // error handler below rewrites the URL. Must stay a same-site absolute path:
  // "//evil.com" is protocol-relative and would leave the site.
  var NEXT = (function () {
    var m = /[?&]next=([^&]*)/.exec(window.location.search);
    var p = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '/';
    return (p.charAt(0) === '/' && p.charAt(1) !== '/' && p.charAt(1) !== '\\') ? p : '/';
  })();

  // Surface an error handed back by the Microsoft sign-in redirect (/login?err=…)
  (function () {
    var m = /[?&]err=([^&]*)/.exec(window.location.search);
    if (!m) return;
    err.textContent = decodeURIComponent(m[1].replace(/\+/g, ' '));
    err.classList.add('show');
    history.replaceState(null, '', window.location.pathname);
  })();

  // --- Easter-egg transition ------------------------------------------------
  // Port of the Streamlit login's time.sleep(8) animation. Click-to-skip added:
  // on a web page a hard 8s freeze with no affordance reads as a hang.
  var eggTimer = null;
  function eggFinish() {
    if (eggTimer) { clearTimeout(eggTimer); eggTimer = null; }
    window.location.href = NEXT;
  }
  function eggPlay(egg) {
    var box = document.getElementById('egg');
    if (!box) { window.location.href = NEXT; return; }
    if (egg.image) {
      var im = document.getElementById('egg-img');
      im.src = egg.image;
      im.style.display = '';
      // Never let a missing asset leave a blank screen mid-transition.
      im.onerror = function () { im.style.display = 'none'; };
    }
    if (egg.emoji) {
      var em = document.getElementById('egg-emoji');
      em.textContent = egg.emoji;
      em.style.display = '';
    }
    document.getElementById('egg-headline').textContent = egg.headline || '';
    document.getElementById('egg-sub').textContent = egg.sub || '';
    box.classList.add('show');
    eggTimer = setTimeout(eggFinish, egg.ms || 8000);
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Connecting to Streamax secure server…';
    fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    })
    .then(function (r) { return r.json().then(function (d) { return {ok: r.ok, d: d}; }); })
    .then(function (res) {
      if (res.ok && res.d.ok) {
        if (res.d.easter_egg) { eggPlay(res.d.easter_egg); return; }
        window.location.href = NEXT;
        return;
      }
      err.textContent = (res.d && res.d.error) || 'Sign-in failed.';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Authenticate';
    })
    .catch(function () {
      err.textContent = 'Could not reach the server. Try again.';
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Authenticate';
    });
  });
</script>
</body>
</html>
