# Streamlit server config. Safe on Streamlit Community Cloud AND in a container
# behind a reverse proxy (Cloudflare -> Cloud Run / Render / Fly / nginx).
[server]
headless = true          # never try to open a browser / prompt for an email
address = "0.0.0.0"      # listen on all interfaces so the container is reachable

# CORS + XSRF are left ON (Streamlit's secure defaults). Note: setting
# enableCORS=false while enableXsrfProtection=true does nothing — Streamlit
# logs "not compatible" and forces enableCORS back to true. Verified in the
# container build, so don't re-add it.
#
# ⚠️ If Jerry GPT's paperclip file-upload fails once it's behind Cloudflare
# ("AxiosError 403" / the upload just spins), disable BOTH together — that is
# the only combination Streamlit honours:
#   enableCORS = false
#   enableXsrfProtection = false
# It's a small security tradeoff (the app is login-gated); prefer putting a
# Cloudflare Access policy in front if you turn them off.

maxUploadSize = 25       # MB — matches the file-upload feature in Jerry GPT

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2AF598"
backgroundColor = "#050810"
secondaryBackgroundColor = "#0B1221"
textColor = "#E6EAF0"
